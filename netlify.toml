[build]
  command = "php build.php"
  publish = "dist"

# Hashed/versioned assets can be cached hard; the HTML must not be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
